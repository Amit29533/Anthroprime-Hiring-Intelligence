Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogFile /tmp/clamd.log
LogTime yes
LogClean no
MaxThreads 2
StreamMaxLength 5M
MaxFileSize 10M
MaxScanSize 25M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 20000
ReadTimeout 30
CommandReadTimeout 30
AlertExceedsMax yes
AlertEncrypted yes
ConcurrentDatabaseReload no
SelfCheck 60
